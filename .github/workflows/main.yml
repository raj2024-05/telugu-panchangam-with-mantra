name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Verify project
        run: |
          test -f app/src/main/java/com/example/panchang/PanchangCalculator.kt
          test -f app/src/main/java/com/example/panchang/BhaktiActivity.kt
          test -f app/src/main/java/com/example/panchang/VratActivity.kt
          test -f app/src/main/java/com/example/panchang/ReminderScheduler.kt
          test -f app/src/main/res/layout/activity_bhakti.xml
          test -f app/src/main/res/layout/activity_vrat.xml
          echo "Project structure OK"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Find generated APK
        run: find app/build/outputs -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TeluguPanchangam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
